<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A2F52">
<title>Sem conexão — Vitrine Eventos</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#FAF8F7;color:#3A3340;font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .box{max-width:340px}
  .ico{width:64px;height:64px;border-radius:20px;background:#F3EEF9;color:#3A2F52;display:grid;place-items:center;margin:0 auto 16px;font-size:28px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 20px;color:#8A8190}
  button{height:48px;padding:0 24px;border:0;border-radius:14px;background:#D3C8EC;color:#3A2F52;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="ico" aria-hidden="true">&#9728;</div>
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar esta tela. Verifique a internet e tente de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
